[project]
name = "kindle-dash"
version = "0.1.0"
description = "E-ink dashboard for a jailbroken Kindle Scribe: Home Assistant lights and Google Calendar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "recurring-ical-events>=3.8.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
kindle-dash = "kindle_dash.app:main"
kindle-dash-paper = "kindle_dash.paper:main"
kindle-dash-feed = "kindle_dash.feed:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
