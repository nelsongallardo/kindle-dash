<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{ refresh_seconds }}; url={{ refresh_url }}">
<title>{{ active|capitalize }}</title>
<script>
  // The Kindle app runtime (old WebKit) renders at the panel's 1860px with no scaling;
  // the Kindle browser already applies 2x. Scale up only in the app.
  if (window.innerWidth > 1300) { document.documentElement.style.zoom = 2; }
</script>
<style>
  /* Layout uses tables only: the Kindle app runtime is ~2011 WebKit (no grid, no unprefixed flexbox). */
  * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: #000; font-family: "Bookerly", Georgia, serif; }
  body { padding: 24px 32px; font-size: 28px; line-height: 1.3; }
  .row { display: table; width: 100%; table-layout: fixed; }
  .row > * { display: table-cell; vertical-align: middle; }
  header { margin-bottom: 20px; }
  .clock { font-size: 64px; font-weight: bold; font-family: Helvetica, Arial, sans-serif; }
  .date { font-size: 30px; text-align: right; }
  nav { border: 3px solid #000; margin-bottom: 28px; }
  nav a { text-align: center; padding: 22px 0; font-size: 30px; font-weight: bold;
          color: #000; text-decoration: none; font-family: Helvetica, Arial, sans-serif; }
  nav a + a { border-left: 3px solid #000; }
  nav a.active { background: #000; color: #fff; }
  .error { border: 3px dashed #000; padding: 24px; font-size: 30px; }
</style>
</head>
<body>
{% block chrome %}
<header class="row">
  <div class="clock">{{ now.strftime("%H:%M") }}</div>
  <div class="date">{{ now.strftime("%A %-d %B") }}</div>
</header>
<nav class="row">
  {% for key, label in screens %}
  <a href="/{{ key }}" class="{{ 'active' if key == active else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
{% endblock %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
<script>
  // The Kindle app runtime has no touch events; swipes arrive through its own gestures API.
  if (window.kindle && window.kindle.gestures) {
    window.kindle.gestures.onswipe = function (direction) {
      if (direction === "left") { window.location.href = {{ swipe_next | tojson }}; }
      if (direction === "right") { window.location.href = {{ swipe_prev | tojson }}; }
    };
  }
</script>
</body>
</html>
