{% extends "base.html" %}
{% block content %}
<style>
  .item { border-top: 4px solid #000; padding: 18px 0 24px; }
  .item .hed { font: bold 46px/1.1 Helvetica, Arial, sans-serif; margin-bottom: 12px; }
  .item .sum { font-size: 32px; line-height: 1.3; margin-bottom: 10px; }
  .item .by { font: bold 24px Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: 1px; }
  .empty { font-size: 36px; padding-top: 40px; text-align: center; }
</style>
{% for item, ago in items %}
<div class="item">
  <div class="hed">{{ item.headline }}</div>
  <div class="sum">{{ item.summary }}</div>
  <div class="by">@{{ item.author }} · {{ ago }}</div>
</div>
{% else %}
<p class="empty">Nothing worth reading on X yet.</p>
{% endfor %}
{% endblock %}
